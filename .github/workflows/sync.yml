name: refresh pending.nix

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      max_prefetch:
        description: "Max tarballs to prefetch this run"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: refresh-pending-nix
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 5h30m, under the 6h job ceiling
    env:
      # cap prefetch per run so a cold start doesn't blow the time budget.
      # subsequent runs hit cache and fill in the rest.
      MAX_PREFETCH: ${{ github.event.inputs.max_prefetch || '300' }}

    steps:
      - uses: actions/checkout@v4

      - name: free disk space on the runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: install nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: install uv
        uses: astral-sh/setup-uv@v3

      - name: cache the prpkgs sqlite db (carries head SHAs + narHashes)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/prpkgs
          key: prpkgs-db-${{ github.run_id }}
          restore-keys: |
            prpkgs-db-

      - name: install prpkgs
        run: |
          uv venv
          uv pip install -e .

      - name: disk before sync
        run: df -h /

      - name: warm cache from committed pending.nix
        # the committed pending.nix doubles as a persistent (rev, narHash)
        # cache, so we only spend network on PRs whose head moved since the
        # last commit. avoids re-prefetching ~1000 tarballs every run.
        run: .venv/bin/python -m prpkgs warm-cache pending.nix

      - name: sync (crawl PRs + head SHAs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python -m prpkgs sync

      - name: stats after sync
        run: .venv/bin/python -m prpkgs stats

      - name: prefetch missing narHashes (incremental)
        # prefetch deletes each unpacked tree from /nix/store right after
        # hashing, so disk usage stays roughly flat. MAX_PREFETCH caps the
        # batch so cold-start runs still finish under the job timeout.
        run: .venv/bin/python -m prpkgs prefetch --max "$MAX_PREFETCH" --workers 4

      - name: disk after prefetch
        if: always()
        run: df -h /

      - name: export pending.nix
        if: always()
        run: .venv/bin/python -m prpkgs export -o pending.nix

      - name: commit if changed
        if: always()
        run: |
          git config user.name  "prpkgs-bot"
          git config user.email "prpkgs-bot@users.noreply.github.com"
          if git diff --quiet -- pending.nix; then
            echo "pending.nix unchanged, nothing to commit"
            exit 0
          fi
          .venv/bin/python -m prpkgs stats > /tmp/stats.txt
          git add pending.nix
          git commit -m "refresh pending.nix $(date -u +%F)" -m "$(cat /tmp/stats.txt)"
          git push
